# Личные настройки LifeOS. Скопируй в config.yaml (он не попадает в git) и правь под себя.
timezone: Europe/Moscow

briefs:            # когда присылать сводки в комнату «Сводки»
  morning: "08:45"
  evening: "21:00"

finance:
  # лимиты расходов в месяц, ₽ (категории без лимита тоже считаются)
  budget:
    Продукты: 38000
    Кафе: 10000
    Алкоголь: 3000
    Авто: 8000
    Отдых: 7000
    ЖКУ: 6500
    Связь: 1600
    Здоровье: 3000
    Игры: 2500
    Маркетплейсы: 2500
    Одежда: 2000
    IT: 1500
    Прочее: 3000
  # не входят в бюджет (обязательные платежи и переводы между своими счетами)
  exclude_from_budget: [Ипотека, Свои счета, Доход, Переводы, Наличные]
  savings_goal:
    name: Дом
    target: 1400000
  # ручной ввод: первое слово сообщения → категория
  categories:
