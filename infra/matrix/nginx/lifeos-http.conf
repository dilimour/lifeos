# Шаг 1: HTTP — выпуск сертификатов certbot (webroot) и редирект на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dilimour.online matrix.dilimour.online ntfy.dilimour.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
