# Шаг 2: HTTPS — включать после выпуска сертификата
# Сертификат один на три имени: /etc/letsencrypt/live/dilimour.online/

# Корень домена: discovery для клиентов Matrix
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dilimour.online;
    ssl_certificate     /etc/letsencrypt/live/dilimour.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dilimour.online/privkey.pem;

    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.dilimour.online"}}';
    }
    location / {
        return 404;
    }
}

# Synapse: только клиентский API, админка — только из локальной сети
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matrix.dilimour.online;
    ssl_certificate     /etc/letsencrypt/live/dilimour.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dilimour.online/privkey.pem;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;   # /sync держит соединение долго

    location /_synapse/admin {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8008;
    }
    location ~ ^(/_matrix|/_synapse/client) {
        proxy_pass http://127.0.0.1:8008;
    }
    location / {
        return 404;
    }
}

# ntfy: push на телефон без сервисов Google (UnifiedPush)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ntfy.dilimour.online;
    ssl_certificate     /etc/letsencrypt/live/dilimour.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dilimour.online/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3m;
        proxy_send_timeout 3m;
        proxy_read_timeout 3m;
    }
}
